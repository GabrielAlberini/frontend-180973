<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Product preview card component</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>

  <section id="card">
    <div class="cont-img">
      <img src="./images/image-product-desktop.jpg" alt="foto de el producto">
    </div>
    <div class="content">
      <h3>PERFUME</h3>
      <h2>Gabrielle Essence Eau De <span>Perfum</span></h2>
      <p> A floral, solar and voluptuous interpretation composed by Olivier Polge,
        Perfumer-Creator for the House of CHANEL.</p>
      <div>
        <h3><strong>$149.99</strong></h3>
        <h4>$169.99</h4>
      </div>
      <button><img src="./images/icon-cart.svg" alt="imagen del carrito">Add to Cart</button>
    </div>
  </section>
</body>

</html>
