<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Averia+Gruesa+Libre&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <section id="card">
    <div class="result">
      <h3>Your Result</h3>
      <div class="score">
        <p class="quantity">76</p>
        <p class="total">of 100</p>
      </div>
      <h3>Great</h3>
      <p> You scored higher than 65% of the people who have taken these tests.</p>
    </div>
    <div class="summary">
      <h3>Summary</h3>
      <ul>
        <li>
          <img src="./assets/images/icon-reaction.svg" alt="reaction icon">
          <p>Reaction</p>
          <p><strong>80</strong> / 100</p>
        </li>
        <li>
          <img src="./assets/images/icon-memory.svg" alt="reaction icon">
          <p>Memory</p>
          <p><strong>92</strong> / 100</p>
        </li>
        <li>
          <img src="./assets/images/icon-verbal.svg" alt="reaction icon">
          <p>Verbal</p>
          <p><strong>61</strong> / 100</p>
        </li>
        <li>
          <img src="./assets/images/icon-visual.svg" alt="reaction icon">
          <p>Visual</p>
          <p><strong>73</strong> / 100</p>
        </li>
      </ul>
      <button>Continue</button>
    </div>
  </section>

  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer> -->
</body>

</html>
